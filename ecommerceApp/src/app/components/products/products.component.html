<!-- Product Table Card -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

          <!-- Table Column Headers -->
          <thead class="table-light">
            <tr>
              <th scope="col" class="ps-4">ID</th>
              <th scope="col">Product Name</th>
              <th scope="col">Category</th>
              <th scope="col">Price</th>
              <th scope="col">Stock</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end pe-4">Actions</th>
            </tr>
          </thead>

          <!-- Static Table Body -->
          <tbody>

            <!-- Item 1: In Stock -->
            <tr>
              <td class="ps-4 fw-bold text-muted">#1</td>
              <td class="fw-semibold">Wireless Headphones</td>
              <td>Electronics</td>
              <td>$99.99</td>
              <td>45</td>
              <td>
                <span class="badge rounded-pill bg-success">In Stock</span>
              </td>
              <td class="text-end pe-4">
                <!-- Action Buttons -->
                <button class="btn btn-sm btn-outline-secondary me-2" title="Edit">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

            <!-- Item 2: Out of Stock -->
            <tr>
              <td class="ps-4 fw-bold text-muted">#2</td>
              <td class="fw-semibold">Cotton T-Shirt</td>
              <td>Clothing</td>
              <td>$19.99</td>
              <td>0</td>
              <td>
                <span class="badge rounded-pill bg-danger">Out of Stock</span>
              </td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-secondary me-2" title="Edit">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

            <!-- Item 3: Low Stock -->
            <tr>
              <td class="ps-4 fw-bold text-muted">#3</td>
              <td class="fw-semibold">Smart Watch</td>
              <td>Electronics</td>
              <td>$199.99</td>
              <td>12</td>
              <td>
                <span class="badge rounded-pill bg-warning text-dark">Low Stock</span>
              </td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-secondary me-2" title="Edit">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

          </tbody>
        </table>
      </div>
    </div>
  </div>
