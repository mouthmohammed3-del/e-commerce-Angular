@if (loadingService.isLoading$ | async) {
  <div class="spinner-overlay" role="status" aria-live="polite">
    <div class="spinner-card shadow-lg text-center p-4 rounded-4 bg-white">
      <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h6 class="text-dark fw-bold mb-1">Processing Request</h6>
      <small class="text-muted">Please wait a moment...</small>
    </div>
  </div>
}
