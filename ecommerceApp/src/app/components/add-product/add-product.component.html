<h1>{{newproduct | json}} </h1>


<form (submit)="addnewproduct()">

  <!-- Name -->
  <div class="mb-3">
    <label class="form-label">Name:</label>

    <input

      type="text"
      class="form-control"
      [(ngModel)]="newproduct.name"
      name="name"
      required
      pattern="[A-Za-z\s]+"
    >
  </div>

  <!-- Price -->
  <div class="mb-3">
    <label class="form-label">Price:</label>
    <input
      type="number"
      class="form-control"
      [(ngModel)]="newproduct.price"
      name="price"
    >
  </div>

  <!-- Quantity -->
  <div class="mb-3">
    <label class="form-label">Quantity:</label>
    <input
      type="number"
      class="form-control"
      [(ngModel)]="newproduct.quantity"
      name="quantity"
    >
  </div>

  <!-- Image -->
  <div class="mb-3">
    <label class="form-label">Image:</label>
    <input
    type="file"
    class="form-control"
    accept="image/*"
  >
  </div>

  <!-- Category -->
  <div class="mb-3">
    <label class="form-label">Categories:</label>

    <select class="form-select form-select-lg mb-3" [(ngModel)]="newproduct.catId" name="catId">

      @for (cat of categories; track cat.id) {

        <option [value]="cat.id">
          {{ cat.name }}
        </option>

      }

    </select>

  </div>

  <button type="submit" class="btn btn-primary">
    Add Product
  </button>

</form>
