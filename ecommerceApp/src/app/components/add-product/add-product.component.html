<h1>{{newProduct | json}} </h1>


<form>

  <!-- Name -->
  <div class="mb-3">
    <label class="form-label">Name:</label>

    <input

      type="text"
      class="form-control"
      [(ngModel)]="newProduct.name"
      name="name"
    >
  </div>

  <!-- Price -->
  <div class="mb-3">
    <label class="form-label">Price:</label>
    <input
      type="number"
      class="form-control"
      [(ngModel)]="newProduct.price"
      name="price"
    >
  </div>

  <!-- Quantity -->
  <div class="mb-3">
    <label class="form-label">Quantity:</label>
    <input
      type="number"
      class="form-control"
      [(ngModel)]="newProduct.quantity"
      name="quantity"
    >
  </div>

  <!-- Image -->
  <div class="mb-3">
    <label class="form-label">Image:</label>
    <input
      type="file"
      class="form-control"
      [(ngModel)]="newProduct.imgUrl"
      name="imgUrl"
    >
  </div>

  <!-- Category -->
  <div class="mb-3">
    <label class="form-label">Categories:</label>

    <select class="form-select form-select-lg mb-3" [(ngModel)]="newProduct.catId" name="catId">

      @for (cat of categories; track cat.id) {

        <option [value]="cat.id">
          {{ cat.name }}
        </option>

      }

    </select>

  </div>

  <button class="btn btn-primary">
    Add Product
  </button>

</form>
