<h1>{{newproduct | json}} </h1>


<form (submit)="addnewproduct()" #addProductForm="ngForm">

  <!-- Name -->
  <div class="mb-3">
    <label class="form-label">Name:</label>

    <input

      type="text"
      class="form-control"
      [(ngModel)]="newproduct.name"
      name="name"
      required
      pattern="^[A-Za-z\s]{3,15}$"
    >
    <div>
      <p class="text-danger">
        <!-- <span *ngIf="addProductForm.submitted && addProductForm.controls.name?.errors?.['required']" class="text-danger">
          Name is required.
        </span>
        <span *ngIf="addProductForm.submitted && addProductForm.controls.name?.errors?.['pattern']" class="text-danger">
          Name must be 3-15 characters long and contain only letters and spaces.
        </span> -->
        name is required and must be 3-15 characters long and contain only letters and spaces.

      </p>
    </div>
  </div>

  <!-- Price -->
  <div class="mb-3">
    <label class="form-label">Price:</label>
    <input
      type="number"
      class="form-control"
      [(ngModel)]="newproduct.price"
      name="price"
    >
  </div>

  <!-- Quantity -->
  <div class="mb-3">
    <label class="form-label">Quantity:</label>
    <input
      type="number"
      class="form-control"
      [(ngModel)]="newproduct.quantity"
      name="quantity"
    >
  </div>

  <!-- Image -->
  <div class="mb-3">
    <label class="form-label">Image:</label>
    <input
    type="file"
    class="form-control"
    accept="image/*"
  >
  </div>

  <!-- Category -->
  <div class="mb-3">
    <label class="form-label">Categories:</label>

    <select class="form-select form-select-lg mb-3" [(ngModel)]="newproduct.catId" name="catId">

      @for (cat of categories; track cat.id) {

        <option [value]="cat.id">
          {{ cat.name }}
        </option>

      }

    </select>

  </div>

  <button type="submit"  [disabled]="addProductForm.invalid" class="btn btn-primary">
    Add Product
  </button>

</form>
