<select id="categorySelect" class="form-select form-select-lg shadow-sm border-0 bg-light" [(ngModel)]="selectedCatId">
  <option [value]="0">All Categories</option>
  @for (cat of categories; track cat.id) {
    <option [value]="cat.id">{{ cat.name }}</option>
  }
</select>


<div>
  <app-products></app-products>
</div>

<div>
  <h4>Today's date : {{myData | data:'short'}}</h4>
  <h2 class="fw-bolder mb-1 text-dark">Tech Store</h2>
  <h5 class="text-success mb-0 fw-bold">Total price: {{ totalPrice | currency }}</h5>
</div>
