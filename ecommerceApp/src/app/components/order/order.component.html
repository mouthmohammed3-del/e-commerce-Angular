<div class="container-fluid py-4">
  <!-- Enhanced Control & Filter Toolbar -->
  <div class="card shadow-sm border-0 rounded-4 mb-4 bg-white">
    <div class="card-body p-4">
      <div class="row g-3 align-items-end">
        
        <!-- Live Search Input with Debounce -->
        <div class="col-12 col-md-5 col-lg-5">
          <label class="form-label fw-bold text-muted small text-uppercase mb-1">
            <i class="bi bi-search me-1"></i> {{ 'SEARCH_PRODUCTS' | translate }}
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
            <input
              type="text"
              class="form-control form-control-lg bg-light border-0"
              [placeholder]="'SEARCH_PRODUCTS' | translate"
              [value]="searchTerm"
              (input)="onSearchChange($event)"
            />
          </div>
        </div>

        <!-- Filter by Category -->
        <div class="col-12 col-sm-6 col-md-3 col-lg-3">
          <label for="categorySelect" class="form-label fw-bold text-muted small text-uppercase mb-1">
            <i class="bi bi-funnel me-1"></i> {{ 'FILTER_BY_CATEGORY' | translate }}
          </label>
          <select id="categorySelect" class="form-select form-select-lg shadow-none border-0 bg-light" [(ngModel)]="selectedCatId">
            <option [value]="0">{{ 'ALL_CATEGORIES' | translate }}</option>
            @for (cat of categories; track cat.id) {
              <option [value]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </div>

        <!-- Sort By Dropdown -->
        <div class="col-12 col-sm-6 col-md-2 col-lg-2">
          <label for="sortSelect" class="form-label fw-bold text-muted small text-uppercase mb-1">
            <i class="bi bi-sort-down me-1"></i> {{ 'SORT_BY' | translate }}
          </label>
          <select id="sortSelect" class="form-select form-select-lg shadow-none border-0 bg-light" [(ngModel)]="selectedSort">
            <option value="default">{{ 'DEFAULT_SORT' | translate }}</option>
            <option value="priceAsc">{{ 'PRICE_LOW_HIGH' | translate }}</option>
            <option value="priceDesc">{{ 'PRICE_HIGH_LOW' | translate }}</option>
            <option value="nameAsc">{{ 'NAME_AZ' | translate }}</option>
          </select>
        </div>

        <!-- Reset Filters Button -->
        <div class="col-12 col-lg-2 d-grid">
          <button
            class="btn btn-outline-secondary btn-lg d-flex align-items-center justify-content-center gap-2 rounded-3 shadow-none"
            (click)="resetFilters()"
            [disabled]="!hasActiveFilters"
          >
            <i class="bi bi-arrow-counterclockwise"></i>
            {{ 'RESET_FILTERS' | translate }}
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Product list component (Cart managed globally) -->
  <div>
    <app-products 
      [recievedCatId]="selectedCatId"
      [searchTerm]="searchTerm"
      [sortBy]="selectedSort"
    ></app-products>
  </div>
</div>
