<div class="container-fluid py-3">
  <!-- Filter Section -->
  <div class="d-flex justify-content-between align-items-end mb-4 bg-white p-4 rounded-4 shadow-sm border-0">
    <div class="col-md-5 col-lg-4">
      <label for="categorySelect" class="form-label fw-bold text-muted small text-uppercase">
        {{ 'FILTER_BY_CATEGORY' | translate }}
      </label>
      <select id="categorySelect" class="form-select form-select-lg shadow-sm border-0 bg-light" [(ngModel)]="selectedCatId">
        <option [value]="0">{{ 'ALL_CATEGORIES' | translate }}</option>
        @for (cat of categories; track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Product list component (Cart managed globally) -->
  <div>
    <app-products [recievedCatId]="selectedCatId"></app-products>
  </div>
</div>
