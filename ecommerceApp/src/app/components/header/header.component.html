<div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end shadow-sm vh-100 position-sticky top-0" style="width: 280px;">

  <!-- Brand / Logo Area (تم إزالة routerLinkActive من هنا لكي لا يتلون الشعار بالأخضر) -->
  <a routerLink="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none">
    <i class="bi bi-shop fs-4 text-primary me-2"></i>
    <span class="fs-4 fw-bolder text-primary">ShopPro</span>
  </a>
  <hr>

  <!-- Main Navigation List -->
  <ul class="nav nav-pills flex-column mb-auto gap-1">

    <!-- Dashboard -->
    <li class="nav-item">
      <!-- تم إضافة / قبل Home، والـ link-dark لتوحيد اللون -->
      <a routerLink="/Home" class="nav-link link-dark d-flex align-items-center" routerLinkActive="weithe bg-success text-white" >
        <i class="bi bi-speedometer2 me-3 fs-5"></i> Dashboard
      </a>
    </li>

    <!-- Orders -->
    <li>
      <!-- تم تغيير href إلى routerLink -->
      <a routerLink="/Orders" class="nav-link link-dark d-flex align-items-center justify-content-between" routerLinkActive="bg-success text-white">
        <div>
          <i class="bi bi-box-seam me-3 fs-5"></i> Orders
        </div>
        <span class="badge bg-danger rounded-pill">12 New</span>
      </a>
    </li>

    <!-- Products -->
    <li>
      <a routerLink="/Products" class="nav-link link-dark d-flex align-items-center justify-content-between" routerLinkActive="bg-success text-white">
        <div>
          <i class="bi bi-tags me-3 fs-5"></i> Products
        </div>
      </a>
    </li>

    <!-- Customers -->
    <li>
      <a routerLink="/Customers" class="nav-link link-dark d-flex align-items-center" routerLinkActive="bg-success text-white">
        <i class="bi bi-people me-3 fs-5"></i> Customers
      </a>
    </li>

    <!-- About Us -->
    <li>
      <a routerLink="/About" class="nav-link link-dark d-flex align-items-center" routerLinkActive="bg-success text-white">
        <i class="bi bi-info-circle me-3 fs-5"></i> AboutUs
      </a>
    </li>

    <!-- Analytics -->
    <li>
      <!-- تم تغيير href إلى routerLink -->
      <a routerLink="/Analytics" class="nav-link link-dark d-flex align-items-center" routerLinkActive="bg-success text-white">
        <i class="bi bi-bar-chart me-3 fs-5"></i> Analytics
      </a>
    </li>
    <li>
      <!-- تم تغيير href إلى routerLink -->
      <a routerLink="/add-product" class="nav-link link-dark d-flex align-items-center" routerLinkActive="bg-success text-white">
        <i class="bi bi-plus-circle me-3 fs-5"></i> Add Product
      </a>
    </li>
    <li>
      <!-- تم تغيير href إلى routerLink -->
      <a routerLink="/login" class="nav-link link-dark d-flex align-items-center" routerLinkActive="bg-success text-white">

        <span *ngIf="!isUserloggedin"><i class="bi-box-arrow-in-right me-3 fs-5"></i>login</span>
        <span *ngIf="isUserloggedin"><i class="bi-box-arrow-in-left me-3 fs-5"></i>Logout</span>
      </a>
    </li>

  </ul>

  <hr>

  <!-- PRO FEATURE: User Profile Dropdown Pinned to Bottom -->
  <div class="dropdown">
    <a href="/Admin User" class="d-flex align-items-center link-dark text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false" routerLinkActive="">
      <!-- Swapped the 'A' avatar box for a clean user icon -->
      <i class="bi bi-person-circle fs-3 text-secondary me-2"></i>
      <strong>Admin User</strong>
    </a>
    <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser">
      <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i> Store Settings</a></li>
      <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i> Profile</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i> Sign out</a></li>
    </ul>
  </div>
</div>
